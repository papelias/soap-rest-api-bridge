[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soap-rest-ai-bridge"
version = "0.1.0"
description = "An MVP SOAP-to-REST integration layer with a natural-language interface."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "zeep>=4.3.3",
    "anthropic",
    "pydantic-settings",
    "mcp>=1.30,<2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soap_rest_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
